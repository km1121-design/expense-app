<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>経費申請</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="bar">
      <h1><span class="bar__logo" aria-hidden="true">¥</span>経費申請</h1>
      <div class="bar__user" id="userBox" hidden>
        <span class="bar__name" id="userName"></span>
        <button type="button" class="link link--muted" id="logoutBtn">ログアウト</button>
      </div>
    </header>

    <!-- ログイン（WebアプリURLが未設定なら、ここで入力する） -->
    <main id="loginView" hidden>
      <form class="card" id="loginForm">
        <h2 id="loginTitle">ログイン</h2>
        <label id="endpointRow" hidden>
          WebアプリURL（…/exec）
          <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" />
        </label>
        <!-- 通常は利用コードだけ。IDとパスワードは管理者の最初のログイン用 -->
        <label id="codeRow">利用コード
          <input id="loginCode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"
                 placeholder="ABCD-EFGH" maxlength="12" />
        </label>
        <div id="pwRows" hidden>
          <label id="nameRow" hidden>表示名<input id="setupName" maxlength="40" autocomplete="name" /></label>
          <label>ユーザーID<input id="loginId" autocomplete="username" /></label>
          <label>パスワード<input id="loginPw" type="password" autocomplete="current-password" /></label>
        </div>
        <button class="btn" type="submit" id="loginSubmit">ログイン</button>
        <button type="button" class="link" id="loginModeBtn">IDとパスワードでログイン（管理者）</button>
        <p class="err" id="loginErr"></p>
      </form>
    </main>

    <main id="appView" hidden>
      <!-- スマホでは画面の下、PCでは上に出す -->
      <nav class="tabs" aria-label="画面の切り替え">
        <button type="button" class="tab is-active" data-tab="apply"><span class="tab__icon" aria-hidden="true">📷</span><span>申請</span></button>
        <button type="button" class="tab" data-tab="list"><span class="tab__icon" aria-hidden="true">📋</span><span>一覧</span></button>
        <button type="button" class="tab" data-tab="accounts" id="accountsTab" hidden><span class="tab__icon" aria-hidden="true">👥</span><span>アカウント</span></button>
      </nav>

      <!-- 申請: 撮る → AIが入れた内容を確かめる → 申請する、の3手で終わるようにする -->
      <section data-panel="apply" class="panel panel--apply">
        <form class="card apply" id="applyForm">
          <div class="shot">
            <div class="shot__empty" id="photoHint">
              <label class="btn btn--big shot__cam">
                <input id="photoCam" class="file" type="file" accept="image/*" capture="environment" />
                <span aria-hidden="true">📷</span> レシートを撮る
              </label>
              <label class="btn btn--ghost shot__pick">
                <input id="photo" class="file" type="file" accept="image/*" />
                写真から選ぶ
              </label>
              <p class="note">撮るだけで、AIが日付・金額・支払先・費目を入れます</p>
              <button type="button" class="link" id="manualBtn">領収書がない（写真なしで入力する）</button>
            </div>
            <div class="shot__done" id="shotDone" hidden>
              <img id="preview" alt="レシート" />
              <div class="shot__status">
                <p class="shot__msg" id="aiMsg"></p>
                <label class="link shot__retake">
                  <input id="photoRetake" class="file" type="file" accept="image/*" />
                  別の写真にする
                </label>
              </div>
            </div>
          </div>

          <!-- よく使う申請（電車の往復など）。押すと内容が入り、日付を複数選んでまとめて申請できる -->
          <div class="quick" id="quick" hidden>
            <div class="quick__head">
              <span class="field__label">よく使う申請</span>
              <button type="button" class="link link--muted" id="quickEdit">編集</button>
            </div>
            <div class="quick__list" id="quickList"></div>
          </div>
          <div class="tplBar" id="tplBar" hidden>
            <span>よく使う申請：<b id="tplName"></b></span>
            <button type="button" class="link" id="tplCancel">やめる</button>
          </div>

          <!-- 入力欄は、写真を選んだとき（または写真なしで入力するとき）に開く -->
          <div class="apply__fields" id="applyFields" hidden>
          <label class="amount">
            <span class="field__label">金額</span>
            <span class="amount__box">
              <span class="amount__yen" aria-hidden="true">¥</span>
              <input id="fAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="0" required />
            </span>
          </label>
          <div class="grid2">
            <label id="dateField"><span class="field__label">日付</span><input id="fDate" type="date" required /></label>
            <label><span class="field__label">支払先</span><input id="fVendor" maxlength="60" placeholder="例: ドトール" /></label>
          </div>
          <button type="button" class="link link--left" id="multiDateBtn" hidden>📅 日付を複数選んで、まとめて申請する</button>
          <!-- 日付を複数選ぶ（1日1件の申請になる） -->
          <div class="field" id="datesField" hidden>
            <span class="field__label">日付（複数選べます。1日1件で申請します）</span>
            <div class="cal" id="cal"></div>
          </div>
          <div class="field">
            <span class="field__label">費目</span>
            <div class="chipset" id="catChips" role="radiogroup" aria-label="費目"></div>
            <input type="hidden" id="fCategory" />
          </div>
          <!-- 事業部が1つの人には出さない（自動で入る） -->
          <div class="field" id="deptField">
            <span class="field__label">事業部</span>
            <div class="chipset" id="deptChips" role="radiogroup" aria-label="事業部"></div>
            <input type="hidden" id="fDept" />
          </div>
          <label><span class="field__label">摘要（任意）</span><input id="fDesc" maxlength="60" placeholder="例: 取引先との会食" /></label>
          <label class="check" id="saveTplRow">
            <input type="checkbox" id="saveTpl" />
            <span>よく使う申請に登録する<small>（次から1タップで入力できます）</small></span>
          </label>
          <div class="apply__bar">
            <button class="btn btn--big" type="submit" id="submitBtn">申請する</button>
          </div>
          </div>
        </form>
        <!-- 今月の自分の申請（申請が記録されたことを、その場で確かめられるように） -->
        <button type="button" class="mine" id="mineSummary" hidden></button>
      </section>

      <!-- 一覧 -->
      <section data-panel="list" class="panel panel--list" hidden>
        <div class="card toolbar">
          <div class="toolbar__row">
            <div class="monthNav">
              <button type="button" class="icon-btn" id="monthPrev" aria-label="前の月">‹</button>
              <input id="month" type="month" aria-label="月" />
              <button type="button" class="icon-btn" id="monthNext" aria-label="次の月">›</button>
              <button type="button" class="pill" id="allMonthsBtn">全期間</button>
            </div>
            <div class="toolbar__right">
              <label class="inline">並べ替え
                <select id="sortKey">
                  <option value="date">日付</option>
                  <option value="month">月ごと</option>
                  <option value="department">事業部ごと</option>
                  <option value="applicant">人ごと</option>
                  <option value="category">費目ごと</option>
                  <option value="amount">金額</option>
                </select>
              </label>
              <button type="button" class="icon-btn" id="reloadBtn" aria-label="最新にする" title="最新にする">↻</button>
            </div>
          </div>
          <!-- 絞り込み: 事業部・人・費目を複数選んで、その分だけ表示する（並べ替えとは別に効く） -->
          <details class="narrow" id="narrow">
            <summary id="narrowSummary">絞り込み</summary>
            <fieldset class="checks">
              <legend>事業部（複数選べます）</legend>
              <div id="narrowDepts"></div>
            </fieldset>
            <fieldset class="checks" id="narrowPeopleBox">
              <legend>人（複数選べます）</legend>
              <div id="narrowPeople"></div>
            </fieldset>
            <fieldset class="checks">
              <legend>費目（複数選べます）</legend>
              <div id="narrowCats"></div>
            </fieldset>
            <button type="button" class="link" id="narrowClear">絞り込みをやめる</button>
          </details>
        </div>

        <div class="listLayout">
          <!-- 集計（合計・件数と、事業部・費目・人ごとの内訳）。棒をタップするとその条件で絞り込む -->
          <aside class="card summary" id="summary" aria-label="集計"></aside>
          <div class="card listCard">
            <div class="totalRow">
              <p class="total" id="total"></p>
              <!-- 絞り込み中だけ出す。集計の棒で絞ったときも、ここから戻せる -->
              <button type="button" class="pill is-on" id="totalClear" hidden>✕ 絞り込みをやめる</button>
            </div>
            <ul class="list rows" id="rows"></ul>
          </div>
        </div>
      </section>

      <!-- アカウント（管理者のみ） -->
      <section data-panel="accounts" hidden>
        <form class="card" id="addUserForm">
          <h2>利用者を追加</h2>
          <label>名前<input id="uName" maxlength="40" required /></label>
          <fieldset class="checks">
            <legend>事業部（複数選べます）</legend>
            <div id="uDepts"></div>
          </fieldset>
          <label>権限
            <select id="uRole">
              <option value="user">一般（自分の申請だけ見られる）</option>
              <option value="admin">管理者（全員分を見られる・利用者を管理できる）</option>
            </select>
          </label>
          <button class="btn" type="submit">追加して利用コードを発行</button>
        </form>

        <!-- 発行したコード。保存はハッシュだけなので、ここを閉じると二度と表示できない -->
        <div class="card issued" id="issued" hidden>
          <h2 id="issuedTitle"></h2>
          <p class="code" id="issuedCode"></p>
          <p class="note">この画面を離れると再表示できません。忘れたときは「コード再発行」で発行し直してください。</p>
          <div class="row">
            <button type="button" class="btn" id="copyInviteBtn">案内文をコピー</button>
            <button type="button" class="link" id="closeIssuedBtn">閉じる</button>
          </div>
        </div>

        <div class="card">
          <h2>利用者一覧</h2>
          <ul class="list" id="userRows"></ul>
        </div>

        <!-- 事業部マスタ。申請と利用者の事業部はここから選ぶ -->
        <div class="card">
          <h2>事業部</h2>
          <ul class="chips" id="deptRows"></ul>
          <form class="row" id="addDeptForm">
            <input id="deptName" maxlength="40" placeholder="新しい事業部名" required />
            <button class="btn btn--sm" type="submit">追加</button>
          </form>
          <p class="note">削除しても、過去の申請や利用者に付いている事業部名はそのまま残ります。</p>
        </div>
      </section>
    </main>

    <!-- 領収書の拡大表示。一覧の小さな画像をタップすると開く（← → で前後の領収書へ） -->
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="領収書">
      <button type="button" class="lb__close" id="lbClose" aria-label="閉じる">✕</button>
      <button type="button" class="lb__nav lb__prev" id="lbPrev" aria-label="前の領収書">‹</button>
      <figure class="lb__fig">
        <img id="lbImg" alt="領収書" referrerpolicy="no-referrer" />
        <figcaption class="lb__cap">
          <div id="lbCap"></div>
          <div><span id="lbCount"></span><a id="lbOpen" target="_blank" rel="noopener">Googleドライブで開く</a></div>
        </figcaption>
      </figure>
      <button type="button" class="lb__nav lb__next" id="lbNext" aria-label="次の領収書">›</button>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
