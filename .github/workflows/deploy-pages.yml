name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "expense-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r expense-app/. _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # v4 以降は隠しファイル（ドットファイル）を既定で含めない。
      # expense-app/ には隠しファイルが無いため既定のままでよい。
      # `.nojekyll` などを置く場合は include-hidden-files: true が必要になる。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
